  <!-- =========================================================
       MAIN WORKSPACE
       ========================================================= -->

  <main class="daily-notes-main">

    <div class="daily-notes-wrap">

      <!-- Workspace heading -->
      <section class="workspace-header">

        <div class="workspace-heading">

          <span class="workspace-eyebrow">
            PERSONAL WORKSPACE
          </span>

          <h1>Notes</h1>

          <p>
            A simple place to write, organize, and keep track of your work.
          </p>

        </div>

        <div class="workspace-actions">

          <button
            id="newWorkTab"
            class="daily-primary-btn"
            type="button"
          >
            <span aria-hidden="true">+</span>
            New Note
          </button>

        </div>

      </section>


      <!-- =====================================================
           WORKSPACE TOOLBAR
           ===================================================== -->

      <section
        class="workspace-toolbar"
        aria-label="Notes controls"
      >

        <div class="workspace-toolbar-left">

          <strong>My Notes</strong>

          <span
            id="tabCount"
            class="tab-count"
          >
            0 notes
          </span>

        </div>

        <div class="workspace-toolbar-right">

          <label
            class="note-search"
            for="tabSearch"
          >
            <span aria-hidden="true">⌕</span>

            <input
              id="tabSearch"
              type="search"
              placeholder="Search notes..."
              autocomplete="off"
            >
          </label>

          <button
            id="clearSearch"
            class="text-btn"
            type="button"
            hidden
          >
            Clear
          </button>

        </div>

      </section>


      <!-- =====================================================
           NOTE TABS
           ===================================================== -->

      <section
        class="tabs-area"
        aria-label="Work notes"
      >

        <div
          id="workTabs"
          class="work-tabs"
          role="tablist"
          aria-label="Work note tabs"
        >
        </div>

        <button
          id="addTabButton"
          class="add-tab-btn"
          type="button"
          aria-label="Create a new note"
          title="Create a new note"
        >
          +
        </button>

      </section>


      <!-- =====================================================
           DOCUMENT WORKSPACE
           ===================================================== -->

      <section
        id="documentWorkspace"
        class="document-workspace"
        aria-label="Note editor"
      >

        <!-- Editor toolbar -->
        <div class="editor-toolbar">

          <div
            class="editor-toolbar-group"
            aria-label="Text formatting"
          >

            <button
              class="editor-btn"
              type="button"
              data-command="bold"
              aria-label="Bold"
              title="Bold"
            >
              <strong>B</strong>
            </button>

            <button
              class="editor-btn"
              type="button"
              data-command="italic"
              aria-label="Italic"
              title="Italic"
            >
              <em>I</em>
            </button>

            <button
              class="editor-btn"
              type="button"
              data-command="underline"
              aria-label="Underline"
              title="Underline"
            >
              <u>U</u>
            </button>

          </div>


          <div
            class="editor-toolbar-group"
            aria-label="Paragraph formatting"
          >

            <button
              class="editor-btn editor-text-btn"
              type="button"
              data-command="formatBlock"
              data-value="H2"
              title="Heading"
            >
              H
            </button>

            <button
              class="editor-btn editor-text-btn"
              type="button"
              data-command="formatBlock"
              data-value="P"
              title="Normal text"
            >
              ¶
            </button>

            <button
              class="editor-btn"
              type="button"
              data-command="insertUnorderedList"
              aria-label="Bullet list"
              title="Bullet list"
            >
              •
            </button>

          </div>


          <div
            class="editor-toolbar-group"
            aria-label="Table controls"
          >

            <button
              id="insertTable"
              class="editor-btn table-tool-btn"
              type="button"
              title="Insert table"
            >
              ▦ Table
            </button>

            <button
              id="addRow"
              class="editor-btn table-tool-btn"
              type="button"
              title="Add row"
              disabled
            >
              + Row
            </button>

            <button
              id="addColumn"
              class="editor-btn table-tool-btn"
              type="button"
              title="Add column"
              disabled
            >
              + Col
            </button>

            <button
              id="deleteRow"
              class="editor-btn table-tool-btn"
              type="button"
              title="Delete selected row"
              disabled
            >
              − Row
            </button>

            <button
              id="deleteColumn"
              class="editor-btn table-tool-btn"
              type="button"
              title="Delete selected column"
              disabled
            >
              − Col
            </button>

          </div>


          <div
            class="editor-toolbar-group editor-history-group"
            aria-label="History"
          >

            <button
              class="editor-btn"
              type="button"
              data-command="undo"
              aria-label="Undo"
              title="Undo"
            >
              ↶
            </button>

            <button
              class="editor-btn"
              type="button"
              data-command="redo"
              aria-label="Redo"
              title="Redo"
            >
              ↷
            </button>

          </div>


<div class="editor-save-status">

  <span
    id="saveIndicator"
    class="save-indicator"
  >
    Saved
  </span>

  <button
    id="saveNote"
    class="save-note-btn"
    type="button"
    title="Save note"
  >
    Save Note
  </button>

</div>


        <!-- Document page -->
        <article class="document-page">

          <div class="document-top">

            <input
              id="noteTitle"
              class="note-title"
              type="text"
              placeholder="Untitled Note"
              aria-label="Note title"
              maxlength="150"
            >

            <div class="document-date-row">

              <label for="noteDate">
                <span>Date</span>

                <input
                  id="noteDate"
                  type="date"
                  aria-label="Note date"
                >
              </label>

            </div>

          </div>


          <!-- Actual notepad editor -->
          <div
            id="noteEditor"
            class="note-editor"
            contenteditable="true"
            role="textbox"
            aria-label="Work note"
            aria-multiline="true"
            spellcheck="true"
            data-placeholder="Start writing your note..."
          >
          </div>


          <div class="document-bottom">

            <span>
              Changes are saved automatically.
            </span>

            <button
              id="duplicateNote"
              class="document-action"
              type="button"
            >
              Duplicate Note
            </button>

            <button
              id="deleteNote"
              class="document-action delete-action"
              type="button"
            >
              Delete Note
            </button>

          </div>

        </article>

      </section>



      </section>

    </div>

  </main>
